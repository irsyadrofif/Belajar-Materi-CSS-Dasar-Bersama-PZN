<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector</title>
    <style>
       h1, h2, p, .merah, #title{
        color: blue;
       }
    </style>
</head>
<body>
    <h1>Ini adalah title</h1>
    <h2>Ini adalah subtitle</h2>
    <p>Ini adalah artikel</p>

    <h3 id="title">Ini contoh</h3>

    <span class="merah"></span>
</body>
</html>
