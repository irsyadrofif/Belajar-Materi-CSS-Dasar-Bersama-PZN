<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class</title>
    <style>
        .red{
            background-color: red;
            text-transform: uppercase;
        }
        .merah {
            color: yellow;
            text-transform: uppercase;
        }
        .upper {
            text-transform: capitalize;
        }
    </style>
</head>
<body>
    <h1 class="red merah">Ini adalah title</h1>
    <h2 class="red merah">Ini adalah subtitle</h2>
    <p class="red merah upper">Ini adalah artikel</p>
</body>
</html>
