<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text</title>
    <style>
        h1 {
            color: blue;
            text-transform: uppercase; /*text transform untuk huruf besar kecil*/
            text-align: justify; /*rata*/
            text-shadow: 8px 1px 6px red;
        }
        p {
            word-spacing: 5px; /*jarak antar kata*/
            /*white-space: nowrap; lurus tanpa enter ini jarang digunakan biasanya gunakan normal*/
            letter-spacing: 1px; /*spasi*/
            line-height: 19px; /*jarak baris*/
            text-indent: 50px; /*ketebalan*/
            text-transform: capitalize; /*text transform untuk huruf besar kecil*/
            text-decoration-line:underline ;
            text-decoration-color: blue;
            text-decoration-thickness: 4px; /*ketebalan */
            text-decoration-style:solid; /*gaya nya*/
        }
    </style>
</head>
<body>
    <h1>Ini judul artikel</h1>
    <p>
        Lorem ipsum dolor sit amet consectetur, adipisicing elit. Doloremque repudiandae autem similique provident sapiente earum illum nesciunt, asperiores adipisci quis ea voluptates dicta et, consequuntur in debitis id nulla! Iusto?
    </p>
</body>
</html>
