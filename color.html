<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>color</title>
    <style>
        h1 {
            color: hsl(129 83% 40)
        }
        h2 {
            color: hsl(297  71% 38)
        }
        p {
            color: rgb(20 56 154)
        }
    </style>
</head>
<body>
    <h1>Ini title</h1>
    <h2>Ini subtitle</h2>
    <p>Ini paragraf</p>
</body>
</html>
