<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Max</title>
    <style>
        /*Digunakan untuk fleksible dengan min & max ,mengatur batas lebar kotak,tidak bisa lebih kecil / lebih besar, meskipun layar berubah, teks didalam otomatis menyesuaikan ruang kotak*/
        div {
            background-color: red;
            width: 100%;
            min-width: 200px;
            max-width: 500px;
        }
    </style>
</head>
<body>
    <div>
        <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Ullam itaque quas ea corporis aliquam optio, temporibus sapiente eum explicabo veritatis rem libero voluptatem voluptatibus in ad. Eaque reprehenderit molestiae ut?</p>
    </div>
</body>
</html>
